appId: io.conclude.galley
productName: Galley
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  # The manual is bundled into the renderer; its source stays out of the app.
  - '!docs/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,README.md}'
  - '!{.env,.env.*,.npmrc}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
afterPack: scripts/pty-helper.cjs
afterSign: scripts/adhoc-sign.cjs
mac:
  category: public.app-category.productivity
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
publish:
  provider: github
  owner: teamconclude
  repo: galley
  releaseType: release
npmRebuild: false
# Review links, galley://open?branch=…, open the app; see src/shared/reviewLink.ts.
protocols:
  - name: Galley review link
    schemes: [galley]
