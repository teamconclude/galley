name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Take the version from the tag
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"

      - name: Install dependencies
        run: npm ci

      # electron-builder treats a defined but empty CSC_LINK as a certificate path, so the
      # signing variables are only exported when the secrets hold a value. Without them
      # the build is signed ad hoc by scripts/adhoc-sign.cjs.
      - name: Enable signing when the certificate secrets exist
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
              echo "$name=${!name}" >> "$GITHUB_ENV"
            done
            echo "NOTARIZE=--config.mac.notarize=true" >> "$GITHUB_ENV"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: |
          npm run build
          npx electron-builder --mac --publish never $NOTARIZE

      # electron-builder's own GitHub publisher raced between the zip and DMG targets and
      # left the release half filled, so the assets are uploaded with gh instead.
      - name: Publish ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dist/*.dmg dist/*.zip dist/latest-mac.yml)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --title "${GITHUB_REF_NAME#v}" --generate-notes
          fi
